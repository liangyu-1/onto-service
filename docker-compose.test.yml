services:
  neo4j:
    image: 10.244.16.120:30002/yuliang/neo4j:5.22.0
    container_name: onto-neo4j
    hostname: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jpass
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=512M
    networks:
      - onto-network

  onto-service-java:
    image: 10.244.16.120:30002/yuliang/onto-service-java:latest
    container_name: onto-service-java
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - ABOX_ENGINE=platform
      - VLLM_EMBEDDING_BASE_URL=http://10.191.23.129:8105
      - VLLM_EMBEDDING_MODEL=bge-m3
      - VLLM_RERANK_BASE_URL=http://10.191.23.129:8104
      - VLLM_RERANK_MODEL=Qwen3-Reranker-4B
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpass
      - KAFKA_BOOTSTRAP_SERVERS=172.16.21.72:9092
      - KAFKA_TOPIC=ontology_events
      - KAFKA_CONSUMER_GROUP_ID=oaas-consumer-group
      - FULL_SYNC_ENABLED=true
    depends_on:
      neo4j:
        condition: service_started
    networks:
      - onto-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  onto-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
