server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: onto-service

  datasource:
    url: jdbc:mysql://${DORIS_HOST:localhost}:${DORIS_PORT:9030}/${DORIS_DB:ontology}?useSSL=false&characterEncoding=UTF-8
    username: ${DORIS_USER:root}
    password: ${DORIS_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:172.16.21.72:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:neo4jpass}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Ontology Service Configuration
onto:
  service:
    # ABOX 对接：默认走数据中台执行查询（不再要求 ABOX 落 Doris）
    abox:
      # platform|doris
      engine: ${ABOX_ENGINE:platform}
      platform:
        base-url: ${DATA_PLATFORM_URL:http://localhost:5001}
        api-key: ${DATA_PLATFORM_API_KEY:}
        dialect: ${DATA_PLATFORM_DIALECT:googlesql}
    # GoogleSQL 配置
    googlesql:
      enabled: true
      catalog-cache-ttl-minutes: 10
    # 查询配置
    query:
      max-limit: 10000
      default-limit: 100
      timeout-seconds: 30
    # Action 配置
    action:
      dry-run-enabled: true
      audit-enabled: true
      default-timeout-seconds: 60
  # vLLM Embedding / Reranker 配置
  vllm:
    embedding:
      base-url: ${VLLM_EMBEDDING_URL:http://localhost:8105}
      model: ${VLLM_EMBEDDING_MODEL:bge-m3}
    rerank:
      base-url: ${VLLM_RERANK_URL:http://localhost:8104}
      model: ${VLLM_RERANK_MODEL:Qwen3-Reranker-4B}

# OaaS (Ontology-aware Retrieval as a Service) 配置
oaas:
  kafka:
    topic: ${KAFKA_TOPIC:ontology_events}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:oaas-consumer-group}
    dlq:
      topic: ${KAFKA_DLQ_TOPIC:ontology-dlq}
  full-sync:
    enabled: ${FULL_SYNC_ENABLED:true}
    auto-on-startup: ${FULL_SYNC_AUTO_ON_STARTUP:true}
    base-url: ${ONTOLOGY_MGMT_URL:http://172.16.21.216:8888}
    snapshot-path: ${ONTOLOGY_SNAPSHOT_PATH:/ontology/api/open/domains}
    page-size: 100
  index:
    rebuild:
      batch-size: 100
      thread-pool-size: 4
  retrieval:
    max-top-k: 100
    default-top-k: 10
  idempotency:
    max-retries: 3
    retry-interval-ms: 5000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
