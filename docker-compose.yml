services:
  neo4j:
    image: neo4j:5.22
    container_name: onto-neo4j
    hostname: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jpass
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=512M
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4jpass 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - onto-network

  # Doris FE (Frontend)
  doris-fe:
    image: apache/doris:fe-4.0.4
    container_name: onto-doris-fe
    hostname: doris-fe
    ports:
      - "8030:8030"
      - "9030:9030"
    environment:
      - FE_MASTER_IP=172.20.0.10
      - FE_MASTER_PORT=9010
      - FE_CURRENT_IP=172.20.0.10
      - FE_CURRENT_PORT=9010
    networks:
      onto-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Doris BE (Backend)
  doris-be:
    image: apache/doris:be-4.0.4
    container_name: onto-doris-be
    hostname: doris-be
    ports:
      - "8040:8040"
      - "9050:9050"
    environment:
      - FE_MASTER_IP=172.20.0.10
      - BE_IP=172.20.0.11
      - BE_PORT=9050
    networks:
      onto-network:
        ipv4_address: 172.20.0.11
    depends_on:
      doris-fe:
        condition: service_healthy

  # Doris init (create DB + tables + demo data)
  doris-init:
    image: apache/doris:fe-4.0.4
    container_name: onto-doris-init
    depends_on:
      doris-fe:
        condition: service_healthy
    networks:
      - onto-network
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/bash","-lc"]
    command:
      - >
        set -e;
        echo "Waiting for Doris MySQL port...";
        for i in $(seq 1 60); do
          if mysql -h doris-fe -P 9030 -uroot -e "SELECT 1" >/dev/null 2>&1; then
            break;
          fi;
          sleep 2;
        done;
        echo "Init schema...";
        mysql -h doris-fe -P 9030 -uroot < /sql/02_abox_schema.sql;
        echo "TBOX tables (object_type, property, relationship, mapping, logic, action, domain, ...)...";
        mysql -h doris-fe -P 9030 -uroot < /sql/01_tbox_schema.sql;
        mysql -h doris-fe -P 9030 -uroot < /sql/03_hai_demo.sql;
        mysql -h doris-fe -P 9030 -uroot < /sql/04_tpch_schema.sql;
        echo "Doris init done.";

  # dbt build (generate metadata + lineage artifacts)
  dbt-build:
    image: python:3.12-slim
    container_name: onto-dbt-build
    depends_on:
      doris-fe:
        condition: service_healthy
      doris-init:
        condition: service_completed_successfully
    networks:
      - onto-network
    working_dir: /workspace
    environment:
      - DORIS_HOST=doris-fe
      - DORIS_PORT=9030
      - DORIS_DB=ontology
      - DORIS_USER=root
      - DORIS_PASSWORD=
    volumes:
      - ./:/workspace
    entrypoint: ["/bin/bash","-lc"]
    command:
      - >
        set -euxo pipefail;
        apt-get update;
        apt-get install -y --no-install-recommends git;
        python -m pip install --no-cache-dir "dbt-mysql==1.7.0";
        chmod +x /workspace/scripts/dbt_build.sh;
        /workspace/scripts/dbt_build.sh;

  # Kafka (single-node for dev/test)
  kafka:
    image: apache/kafka:4.2.0
    container_name: onto-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - onto-network

  # Ontology Service Java
  onto-service-java:
    image: 10.244.16.120:30002/yuliang/onto-service-java:latest
    container_name: onto-service-java
    ports:
      - "8080:8080"
    environment:
      - DORIS_HOST=doris-fe
      - DORIS_PORT=9030
      - DORIS_DB=ontology
      - DORIS_USER=root
      - DORIS_PASSWORD=
      - ABOX_ENGINE=doris
      - VLLM_EMBEDDING_URL=http://10.191.23.129:8105
      - VLLM_EMBEDDING_MODEL=bge-m3
      - VLLM_RERANK_URL=http://10.191.23.129:8104
      - VLLM_RERANK_MODEL=Qwen3-Reranker-4B
      - FULL_SYNC_AUTO_ON_STARTUP=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - onto-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5



volumes:
  doris-fe-data:
  doris-be-data:
  neo4j-data:
  neo4j-logs:

networks:
  onto-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
